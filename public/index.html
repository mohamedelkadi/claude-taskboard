<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
<script>
  // before first paint, so the page never flashes the wrong theme
  try { var t = localStorage.getItem('tb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header id="top"></header>
<main id="main"><div class="loading">Reading your Claude sessions…</div></main>
<aside id="drawer" hidden></aside>
<section id="convo" aria-label="Matches inside conversations" hidden></section>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script src="/core.js"></script>
<script src="/board.js"></script>
<script src="/drawer.js"></script>
<script src="/views.js"></script>
<script src="/diary.js"></script>
<script src="/modals.js"></script>
<script src="/search.js"></script>
<script src="/main.js"></script>
</body>
</html>
